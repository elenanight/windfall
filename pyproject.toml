[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windfall"
# The version lives in exactly one place: the VERSION file. Everything else
# (this table, windfall/__init__.py, the README badge) is derived from it.
dynamic = ["version"]
description = "A class-based TUI compositor and engine for building terminal apps and games with rich and readchar."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Elena Burt" }]
dependencies = [
    "rich>=13.7.2",
    "readchar>=4.0.0",
]

[project.scripts]
windfall = "windfall_cli.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.setuptools]
# "windfall.examples" maps the top-level examples/ dir into the package so
# `--example` works from an installed wheel. Shipping them as top-level
# modules would put generic names (menu, snake) into site-packages.
packages = ["windfall", "windfall_cli", "windfall.examples"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.package-dir]
"windfall.examples" = "examples"

[tool.setuptools.package-data]
windfall_cli = ["templates/*", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*.md", "windfall_cli/templates"]

[tool.ruff.format]
# Formatting exclusions only — `ruff check` still lints these paths.
#
# "*.md": ruff formats python blocks inside markdown, which collapses the
# hand-aligned comment columns in the wiki's code samples. wiki/ is rsynced to
# the public wiki repo by wiki-sync.yml, so that churn would propagate.
#
# "windfall_cli/templates": the app template is a scaffold artifact copied
# into every new project, not library code, and formatting it inflates its
# build() by 9% against the function-length gate.
exclude = ["*.md", "windfall_cli/templates/"]