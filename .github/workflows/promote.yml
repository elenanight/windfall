name: auto-promote
on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run python scripts/update_readme.py --check
      - run: uv run python scripts/cut_release.py --check

  merge-dev-to-main:
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: windfall-promote-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          find_pr() {
            LINE=$(gh pr list --head dev --base main 2>/dev/null | head -n 1)
            case "$LINE" in
              \#*) echo "$LINE" | awk '{print $1}' | tr -d '#';;
            esac
          }
          PR=$(find_pr)
          if [ -z "$PR" ]; then
            if URL=$(gh pr create --base main --head dev --title "chore: promote dev to main" --body "Automated promotion — merges on green." 2>/tmp/pr-err.txt); then
              PR=${URL##*/}
            elif grep -q "already exists" /tmp/pr-err.txt; then
              for i in $(seq 1 12); do
                sleep 10
                PR=$(find_pr)
                [ -n "$PR" ] && break
              done
            else
              cat /tmp/pr-err.txt >&2
              exit 1
            fi
          fi
          [ -n "$PR" ] || { echo "could not find or create promote PR" >&2; exit 1; }
          for i in $(seq 1 90); do
            if gh pr checks "$PR" 2>/dev/null | awk '$1=="test" && $2=="pass" {found=1} END{exit !found}'; then
              break
            fi
            sleep 10
          done
          gh pr checks "$PR" 2>/dev/null | awk '$1=="test" && $2=="pass" {found=1} END{exit !found}'
          gh pr merge "$PR" --merge
        env:
          GH_TOKEN: ${{ github.token }}
