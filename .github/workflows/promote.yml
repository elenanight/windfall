name: auto-promote
on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run python scripts/update_readme.py --check
      - run: uv run python scripts/cut_release.py --check

  merge-dev-to-main:
    needs: test
    runs-on: ubuntu-24.04
    concurrency:
      group: windfall-promote-main
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          PR=$(gh pr list --head dev --base main --json number --jq '.[0].number')
          if [ -z "$PR" ] || [ "$PR" = "null" ]; then
            PR=$(gh pr create --base main --head dev --title "chore: promote dev to main" --body "Automated promotion — merges on green." --json number --jq '.number')
          fi
          gh pr merge "$PR" --auto --merge
        env:
          GH_TOKEN: ${{ github.token }}
