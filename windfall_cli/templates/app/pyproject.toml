[project]
name = "@@package@@"
version = "0.1.0"
description = "@@title@@"
requires-python = ">=3.14"
dependencies = [
    "windfall",
    "rich>=13.7.2",
    "readchar>=4.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

# @@uv_sources@@

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-q"